<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ Coffee Watcher</title>

<style>
body{
  font-family: system-ui, -apple-system, sans-serif;
  background: #667eea;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.card{
  background: white;
  color: black;
  padding: 30px;
  border-radius: 15px;
  width: 400px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.status{
  font-size: 20px;
  margin-bottom: 10px;
  font-weight: bold;
}

.small{
  font-size: 14px;
  color: gray;
  margin-bottom: 15px;
}

ul{
  padding: 0;
  list-style: none;
  max-height: 200px;
  overflow: auto;
  margin-bottom: 15px;
  border: 1px solid #eee;
  border-radius: 8px;
}

li{
  padding: 8px 12px;
  border-bottom: 1px solid #eee;
  font-size: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

li:last-child { border-bottom: none; }

h3 {
  margin-top: 20px;
  font-size: 18px;
  border-bottom: 2px solid #667eea;
  padding-bottom: 5px;
}

.drink-name { font-weight: 500; }
.drink-val { 
  background: #667eea; 
  color: white; 
  padding: 2px 8px; 
  border-radius: 10px; 
  font-size: 13px; 
}
</style>
</head>

<body>

<div class="card">
  <h1>☕ Coffee Watcher</h1>

  <div class="status">
    API: <span id="apiStatus">Kontroluji...</span>
  </div>

  <div class="small">
    Poslední aktualizace: <span id="lastUpdate">-</span>
  </div>

  <div>
    Počet lidí v systému: <span id="count" style="font-weight:bold">0</span>
  </div>

  <h3> Uživatelé</h3>
  <ul id="userList"></ul>

  <h3> Evidence drinků</h3>
  <ul id="coffeeList">
    </ul>

</div>

<script>
const url = "https://crm.skch.cz/ajax0/procedure.php";

function makeBaseAuth(user, password) {
  return "Basic " + btoa(user + ":" + password);
}

const AUTH_HEADER = makeBaseAuth("coffe", "kafe");

const apiStatusEl = document.getElementById("apiStatus");
const countEl = document.getElementById("count");
const userListEl = document.getElementById("userList");
const coffeeListEl = document.getElementById("coffeeList");
const lastUpdateEl = document.getElementById("lastUpdate");

let lastTotalDrinks = 0;


function notify(title, text){
  if(Notification.permission === "granted"){
    new Notification(title, { body: text });
  }
}

if("Notification" in window){
  Notification.requestPermission();
}


async function checkAPI(){
  try{
    const res = await fetch(`${url}?cmd=getPeopleList`, {
      headers: { Authorization: AUTH_HEADER }
    });
    if(res.ok){
      apiStatusEl.textContent = "✅ dostupné";
      apiStatusEl.style.color = "green";
    } else {
      throw new Error();
    }
  } catch {
    apiStatusEl.textContent = "❌ nedostupné";
    apiStatusEl.style.color = "red";
  }
}


function updateTime(){
  const now = new Date();
  lastUpdateEl.textContent = now.toLocaleTimeString();
}


async function fetchData(){
  try{
  
    const resUsers = await fetch(`${url}?cmd=getPeopleList`, {
      headers: { Authorization: AUTH_HEADER }
    });
    const usersData = await resUsers.json();
    const users = Array.isArray(usersData) ? usersData : Object.values(usersData);
    
    countEl.textContent = users.length;
    userListEl.innerHTML = "";
    users.forEach(u => {
      const li = document.createElement("li");
      li.textContent = u.name || u.jmeno || "Uživatel";
      userListEl.appendChild(li);
    });

    
    const resCoffee = await fetch(`${url}?cmd=getDrinks`, {
      headers: { Authorization: AUTH_HEADER }
    });

    if(resCoffee.ok){
      const coffeeData = await resCoffee.json();
      coffeeListEl.innerHTML = "";
      
      
      const drinkTypes = ["Coffe", "Espresso", "Mléko", "Long", "Doppio+"];
      let currentTotal = 0;

      drinkTypes.forEach(type => {
        const val = coffeeData[type] ?? 0; 
        currentTotal += parseInt(val);

        const li = document.createElement("li");
        li.innerHTML = `<span class="drink-name">${type}</span><span class="drink-val">${val} ks</span>`;
        coffeeListEl.appendChild(li);
      });

      
      if(lastTotalDrinks !== 0 && currentTotal > lastTotalDrinks){
        notify("☕ Nové kafe!", `V evidenci přibyl drink (Celkem: ${currentTotal})`);
      }
      lastTotalDrinks = currentTotal;
    }

    updateTime();

  } catch(e) {
    console.error("Chyba dat:", e);
  }
}


setInterval(() => {
  checkAPI();
  fetchData();
}, 10000);


checkAPI();
fetchData();

</script>

</body>
</html>
